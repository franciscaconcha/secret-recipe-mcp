[project]
name = "secret-recipe-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.8",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]      # so tests can `import server`, like `uv run src/server.py` does
testpaths = ["tests"]
asyncio_mode = "auto"     # run `async def` tests without a decorator on each one
asyncio_default_fixture_loop_scope = "function"
